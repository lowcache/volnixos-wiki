baseURL = "https://wiki.infernalcode.com/"
locale = "en-US"
defaultContentLanguage = "en"

# NOTE: there is deliberately no top-level `theme =` here. See the
# ignoreConfig comment on the module import below.
title = "Volatile NixOS Configuration"
enableRobotsTXT = true
enableInlineShortcodes = true
enableEmoji = true
# Sheet revision dates come from git commit history. Without this every page
# reports .Lastmod as 0001-01-01, which the title block printed verbatim.
# Templates still guard on IsZero so a shallow CI clone degrades to "—"
# rather than to a wrong date.
enableGitInfo = true

# The wiki has no taxonomies. E25DX disables these in its own reference config;
# without it Hugo emits empty /tags/ and /categories/ pages.
disableKinds = ["taxonomy", "term"]

[minify]
  disableXML = true
  minifyOutput = true
  # The design direction contract is an HTML comment at the top of <body>
  # (see layouts/home.html and layouts/single.html). Hugo's HTML minifier
  # strips comments by default, which would erase a record that is meant to
  # be auditable in the SERVED output, not just in the templates.
  [minify.tdewolff.html]
    keepComments = true

# The theme is a Hugo Module, resolved through go.mod — NOT a git submodule.
# `go` must be on PATH for module resolution (see flake.nix, Makefile).
[module]
  [[module.imports]]
    path = "github.com/dumindu/E25DX"
    # ignoreConfig is REQUIRED, not tidiness.
    #
    # E25DX ships a hugo.yaml at its module root that doubles as its reference
    # site config, and it contains `theme: E25DX`. Hugo merges an imported
    # module's config by default, then tries to resolve that as a LOCAL theme:
    #   module "E25DX" not found in ".../themes/E25DX"
    # which is unfixable from our side because the name has no module path.
    # ignoreConfig stops Hugo reading that file at all. Everything the theme
    # actually needs from it — markup/goldmark settings, params defaults — is
    # declared explicitly in this file instead. Its layouts/assets/i18n/data
    # still mount, because those are Hugo's default mounts and do not come from
    # the ignored config.
    ignoreConfig = true

[languages]
  [languages.en]
    weight = 1
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    title = "Volatile NixOS Configuration"
    [languages.en.params]
      description = "A stateless, flake-driven NixOS workstation — ephemeral tmpfs root, CachyOS kernel, Lanzaboote Secure Boot, sops-nix secrets, microvm.nix gateways, a niri + Noctalia v5 Wayland desktop, and a Nix-on-Droid phone tier."

[markup]
  [markup.highlight]
    # noClasses=false emits CSS classes instead of inline styles, so the theme's
    # (and our) stylesheet controls code colour rather than Chroma hardcoding it.
    noClasses = false
  [markup.goldmark.renderer]
    # Required: the home page and the phone index use raw <div class="vol-*">
    # blocks carried over from the MkDocs build.
    unsafe = true
  [markup.goldmark.parser.attribute]
    block = true
    title = true
  [markup.tableOfContents]
    pre = '<nav id="TableOfContents" aria-label="Table of Contents">'
    post = "</nav>"
    startLevel = 2
    endLevel = 3

# ---------------------------------------------------------------------------
# Analytics. E25DX renders layouts/_partials/analytics.html only when this ID
# is set, so leaving it commented ships NO tracking script at all.
#
# Ads are a separate, still-open decision. The layout already reserves the
# title block as a support rail carrying real author content, so inventory can
# be introduced there later without reflow and without sitting adjacent to the
# tool recommendations in the prose. No ad code is present anywhere.
# ---------------------------------------------------------------------------
# [services.googleAnalytics]
#   ID = "G-XXXXXXXXXX"

[params]
  # Buttondown list for the newsletter form at the foot of every sheet. Same
  # list as the blog: this wiki is where the search traffic actually lands
  # (1,268 of 1,307 impressions on the property), and until now there was no
  # way for any of it to become anything. Empty string renders no form at all,
  # so the partial is safe if the list ever moves.
  buttondown = "volatiletestimony"
  enableOGXSEO = false
  # Search is a POST-BUILD step: the theme renders the UI, but the index is only
  # produced by running `pagefind --site public` after Hugo. build.sh does that.
  enablePageFind = true

  [params.project]
    startYear = 2026
    presentYear = 2026
    [params.project.repo]
      # The wiki's own repo — this is what the edit/source links resolve against.
      main = "lowcache/volnixos-wiki"
    [params.project.themeColor]
      light = "#ffffff"
      dark = "#101010"

  [params.author]
    name = "lowcache"
    url = "https://github.com/lowcache"

# Header nav. The left sidebar REQUIRES a menus.main entry whose
# identifier equals the section name — left-sidebar.html looks up
# `where site.Menus.main "Identifier" page.Section` and indexes [0].
[menus]
  [[menus.main]]
    identifier = "architecture"
    name = "Architecture"
    url = "/architecture/"
    weight = 10
    [menus.main.params]
      icon = "vol-strata"
  [[menus.main]]
    identifier = "networking"
    name = "Networking"
    url = "/networking/"
    weight = 20
    [menus.main.params]
      icon = "vol-net"
  [[menus.main]]
    identifier = "system"
    name = "System"
    url = "/system/"
    weight = 30
    [menus.main.params]
      icon = "vol-chip"
  [[menus.main]]
    identifier = "phone"
    name = "Phone"
    url = "/phone/"
    weight = 40
    [menus.main.params]
      icon = "vol-handset"
  [[menus.main]]
    identifier = "desktop"
    name = "Desktop"
    url = "/desktop/"
    weight = 50
    [menus.main.params]
      icon = "vol-window"
  [[menus.main]]
    identifier = "reference"
    name = "Reference"
    url = "/reference/"
    weight = 60
    [menus.main.params]
      icon = "vol-sheet"
  [[menus.main]]
    identifier = "tooling"
    name = "Tooling"
    url = "/tooling/"
    weight = 70
    [menus.main.params]
      icon = "vol-caliper"
