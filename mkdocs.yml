site_name: Volatile NixOS Configuration
site_description: >-
  A stateless, flake-driven NixOS workstation — ephemeral tmpfs root, CachyOS
  kernel, Lanzaboote Secure Boot, sops-nix secrets, microvm.nix gateways, and a
  niri + Noctalia v5 Wayland desktop.
site_author: automated indigency / lowcache
site_url: https://wiki.infernalcode.com/
# These two point at DIFFERENT repos on purpose.
#
# The header link is the config — that is the thing readers come here for. The
# edit pencil has to be the wiki repo, because that is where the markdown lives.
#
# Normally you cannot split them: edit_uri is resolved relative to repo_url. An
# ABSOLUTE edit_uri overrides that base (urljoin semantics), which is what makes
# this work. Verified in the built HTML, not assumed — if you ever shorten
# edit_uri back to a relative `edit/main/docs/`, it will silently start pointing
# at volnixos/edit/... again, which 404s.
#
# History: the pages used to live here as a tracked *symlink* in the config repo
# (mode 120000 → /persist/home/lowcache/CodeRepo/blogs/wiki/docs), so GitHub
# served `docs` as a symlink blob, no markdown was under version control, and any
# edit URL 404'd. The wiki is its own repo now. In-page links to
# volnixos/blob/main/... are correct and should stay — the Nix source is there.
repo_url: https://github.com/lowcache/volnixos
repo_name: lowcache/volnixos
edit_uri: https://github.com/lowcache/volnixos-wiki/edit/main/docs/
copyright: Volatile NixOS · 2026 · dev LowCache

theme:
  name: material
  # NO custom_dir. It used to say `overrides`, which resolves relative to this
  # file and therefore named ./overrides — the nixpkgs overlay patch directory,
  # not a theme directory. Two consequences, both live:
  #
  #   1. mkdocs copies everything in custom_dir into the site root, so
  #      gmic-qt-filtersview-nullptr-contextmenu.patch was published at
  #      https://wiki.infernalcode.com/gmic-qt-filtersview-nullptr-contextmenu.patch
  #      and answered 200 with a C++ diff for a GIMP plugin.
  #   2. The wiki working copy at ~/CodeRepo/blogs/wiki is hard-linked file by
  #      file, and directories cannot be hard-linked, so ./overrides does not
  #      exist there and a build run from that directory fails on a custom_dir
  #      that points at nothing.
  #
  # There were no theme overrides to lose: a search of both trees found no
  # template files under any overrides path. If real overrides are ever added,
  # give them their own directory name that cannot collide with the Nix tree,
  # and add it to BOTH working copies.
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: vol-light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    # Renders the "edit this page" pencil. Material only shows it when this
    # feature is on — `edit_uri` alone does nothing, which is why the setting sat
    # inert for so long. Only enabled now that edit_uri resolves to a real repo
    # (see the repo_url note above); turning it on while docs/ was a symlink in
    # the config repo would have shipped a 404 on every page.
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lowcache
      name: lowcache on GitHub
    - icon: fontawesome/solid/snowflake
      link: https://github.com/lowcache/volnixos
      name: Volatile NixOS
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Architecture:
      - architecture/index.md
      - Boot & Secure Boot: architecture/boot.md
      - Impermanence & Persistence: architecture/impermanence.md
      - Kernel & Performance: architecture/kernel.md
      - Secrets (sops-nix): architecture/secrets.md
  - Networking:
      - networking/index.md
      - Tor net-gate: networking/net-gate.md
      - Tailscale VM: networking/tailscale.md
  - System:
      - Hybrid GPU: system/gpu.md
      - AI Stack: system/ai-stack.md
      - Virtualization: system/virtualization.md
  - Phone:
      - phone/index.md
      - Nix-on-Droid: phone/nix-on-droid.md
      - Backports & proot: phone/backports.md
      - Phone Agent: phone/phone-agent.md
  - Desktop:
      - desktop/index.md
      - niri Compositor: desktop/niri.md
      - Noctalia Shell: desktop/noctalia.md
      - Theming Engine: desktop/theming.md
  - Reference:
      - Flake Inputs & Outputs: reference/flake.md
      - Home Manager Modules: reference/home-manager.md
      - Dotfiles: reference/dotfiles.md
  - Tooling:
      - Makefile & Operations: tooling/makefile.md
      - Fish Functions: tooling/fish.md
      - Agent Toolchain: tooling/agents.md
  - Troubleshooting: troubleshooting.md
  # Blog is a separate property, not a wiki section. The tab now links out to the
  # real blog at infernalcode.com; the in-wiki blog/ directory was the first
  # implementation and was removed once the Hugo blog superseded it (its two posts
  # were near-verbatim duplicates of published posts). CSS pushes this to the far
  # right of the tab bar and gives it the gold accent (see stylesheets/extra.css).
  - Blog: https://infernalcode.com/
